<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../../public/CSS/common.css" />
    <link rel="stylesheet" href="../../public/CSS/navbar.css" />
    <link
      rel="stylesheet"
      type="text/css"
      href="../../public/Responsive/ResponsiveNavbar.css"
    />
    <link rel="stylesheet" href="../../public/CSS/userProfile.css" />
    <title>HealthyDay</title>
  </head>
  <body>
    <header class="healthyday_header">
      <nav class="upper_navbar">
        <p id="nav_date_day">Friday,30/08/2024</p>
        <div class="cart_login_buttons_container">
          <button class="cart_button" title="User Cart">
            CART&lpar;0&rpar; <i class="fa-solid fa-cart-shopping"></i>
          </button>
          <button class="login_button" title="Sign in with your account">
            LOGIN <i class="fa-solid fa-user"></i>
          </button>
          <button class="hamburger_button">
            <i class="fa-solid fa-bars"></i>
          </button>
        </div>
      </nav>
      <nav class="lower_navbar">
        <div class="close_button_container">
          <button class="nav_close_button">
            <i class="fa-solid fa-xmark"></i>
          </button>
        </div>

        <!-- <p class="brand_logo">HEALTHYDAY</p> -->
        <p class="brand_logo">24*7Food</p>

        <ul class="navbar_list">
          <li class="list_item">
            <a href="./Home.html" title="Home Page" class="nav_link">Home</a>
          </li>
          <li class="list_item">
            <a href="./Menu.html" title="HealthyDay Menu" class="nav_link"
              >Menu</a
            >
          </li>
          <li class="list_item">RESTAURANTS</li>
          <li class="list_item">ABOUT</li>
        </ul>
      </nav>
    </header>

    <section class="user_profile_section">
      <div class="user_profile_container">
        <div class="user_information_container">
          <div class="personal_information_container">
            <h2 class="infhd">Personal Information</h2>
            <form class="details_form">
              <div class="each_form_detail">
                <label for="newName" class="form_labels">Full Name : </label>
                <input
                  type="text"
                  value="Jaspreet Singh"
                  id="newName"
                  placeholder="Enter new Name"
                  class="form_inputs"
                />
              </div>

              <p>Address : </p>

              <div class="each_form_detail">
                <label for="newEmail" class="form_labels"
                  >Select City :
                </label>
                <input
                  type="text"
                  value="singhjaspreet2425@gmail.com"
                  id="newEmail"
                  contenteditable="false"
                  placeholder="Enter new Email"
                  class="form_inputs"
                />
              </div>
              <div class="form_btn_cont">
                <button type="button" class="upd_btn">Update Data</button>
                <button class="save_btn">Save Changes</button>
              </div>
            </form>
          </div>
        </div>
        <div class="user_action_buttons_container">
          <div class="upcont">
            <div class="uppc">
              <img src="../../public/Images/profile.png" alt="" class="upimg" />
            </div>
            <div class="unae">
              <p>Welcome Back</p>
              <p>Jaspreet Singh</p>
            </div>
          </div>

          <div class="act_btn_content">
            <h3 class="acs_hdng">Account Settings</h3>
            <ul class="action_buttons_list">
              <li class="btn_list_item">
                <button class="abtn">Personal Information</button>
              </li>
              <li class="btn_list_item">
                <button class="abtn">Change Password</button>
              </li>
              <li class="btn_list_item">
                <button class="abtn">Cart Details</button>
              </li>
              <li class="btn_list_item">
                <button class="abtn">Logout Account</button>
              </li>
            </ul>
          </div>
        </div>
      </div>
    </section>

    <script
      src="https://kit.fontawesome.com/e24141db11.js"
      crossorigin="anonymous"
    ></script>
    <script
      type="application/javascript"
      src="../../public/Scripts/navbar.js"
    ></script>
  </body>
</html>
